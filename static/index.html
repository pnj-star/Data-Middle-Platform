async function loadMilvusDocs() {
  const input = document.getElementById("milvusCollection");
  const next = input ? input.value.trim() : "";
  if (next) milvusColl = next;
  if (input) input.value = milvusColl;
  const q = document.getElementById("milvusSearch")?.value.trim() || "";
  const source = document.getElementById("milvusSource")?.value.trim() || "";
  const file_name = document.getElementById("milvusFileName")?.value.trim() || "";
  const tenant_id = document.getElementById("milvusTenant")?.value.trim() || "";
  const kb_id = document.getElementById("milvusKb")?.value.trim() || "";
  const params = new URLSearchParams();
  params.set("collection", milvusColl);
  params.set("page", milvusPage);
  params.set("limit", MILVUS_PAGE_SIZE);
  if (file_name) params.set("file_name", file_name);
  if (tenant_id) params.set("tenant_id", tenant_id);
  if (kb_id) params.set("kb_id", kb_id);
  if (q) params.set("q", q);
  if (source) params.set("source", source);
  const url = "/api/milvus/documents?" + params.toString();
  try {
    const r = await API.get(url);
    const el = document.getElementById("milvusDocList");
    const tb = document.getElementById("milvusToolbar");
    if (!el) return;
    milvusDocs = r.documents;
    if (r.pk_field) milvusPkField = r.pk_field;
    milvusDocs = milvusDocs.map(d => ({ ...d, pk: String(d.pk != null ? d.pk : d.id) }));
    const truncNote = r.file_name_truncated ? `<div class="milvus-stats-note">文件名匹配超过 500 个，仅按最新 500 个源文件过滤。</div>` : "";
    if (!r.documents.length) {
      if (tb) tb.style.display = "none";
      el.innerHTML = `<div class="card"><div class="empty-state"><div class="icon">${icon("search",48)}</div><p>${esc(milvusColl)} 无结果 (共 ${r.total} 条)</p></div>${truncNote}${milvusPaginationHtml(r.total)}</div>`;
      loadMilvusCollectionStats();
      return;
    }
    if (tb) tb.style.display = "";
    el.innerHTML = `<div class="card">
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:8px;">共 ${r.total} 条${truncNote}</div>
      <table><thead><tr><th style="width:32px;"><input type="checkbox" id="milvusCheckAll" onchange="toggleCheckAllMilvus()" title="全选"></th><th>ID</th><th>内容（完整）</th><th>源文件</th><th style="width:50px;">操作</th></tr></thead><tbody>${milvusTableBodyHtml()}</tbody></table>${milvusPaginationHtml(r.total)}
    </div>`;
    // Must be after innerHTML so checkboxes exist
    var cbAll = document.getElementById("milvusCheckAll");
    if (cbAll) cbAll.checked = false;
    updateMilvusToolbar();
    loadMilvusCollectionStats();
    setTimeout(refreshIcons, 50);
  } catch(e) {
    const el = document.getElementById("milvusDocList");
    if (el) el.innerHTML = `<div class="card"><p style="color:var(--ink-faint);">加载失败: ${esc(e && e.message ? e.message : e)}</p></div>`;
    loadMilvusCollectionStats();
  }
}

function getCheckedMilvus() {
  return Array.from(document.querySelectorAll(".milvus-check:checked")).map(cb => {
    const i = parseInt(cb.value);
    return milvusDocs[i];
  });
}

function updateMilvusToolbar() {
  const checked = getCheckedMilvus();
  const countEl = document.getElementById("milvusSelectCount");
  if (countEl) countEl.textContent = checked.length ? "已选 "+checked.length+" 条" : "";
  const all = document.querySelectorAll(".milvus-check");
  const checkedAll = all.length > 0 && checked.length === all.length;
  const cb = document.getElementById("milvusCheckAll");
  if (cb) cb.checked = checkedAll;
}

function toggleCheckAllMilvus() {
  const all = document.getElementById("milvusCheckAll");
  document.querySelectorAll(".milvus-check").forEach(cb => { cb.checked = all.checked; });
  updateMilvusToolbar();
}

async function deleteMilvusDoc(id, coll) {
  if (!confirm("确认删除该向量数据？")) return;
  const delId = "single_del_"+Date.now();
  state.runningTasks[delId] = { label: "删除向量数据", step: "deleting", pct: 30 };
  renderTaskPanel();
  setStatus("删除向量数据", "正在删除...", 30);
  // Optimistically remove the row from the local array and
  // re-render the table immediately so the row vanishes at once.
  milvusDocs = milvusDocs.filter(d => String(d.pk) !== String(id));
  _renderMilvusTable();
  refreshGlobalMilvusStatsAfterDelete(coll);
  try {
    await API.del("/api/milvus/documents/"+encodeURIComponent(id)+"?collection="+encodeURIComponent(coll)+"&"+tenantScopeQuery());
    state.runningTasks[delId] = { label: "删除向量数据", step: "done", pct: 100, state: "SUCCESS" };
    renderTaskPanel();
    setStatus("删除完毕", "", 100, "SUCCESS");
    toast("已删除");
    // Wait for Milvus flush+load to settle, then reconcile from server
    setTimeout(() => loadMilvusDocs(), 600);
  } catch(e) {
    // Restore from server if the delete actually failed
    loadMilvusDocs();
    state.runningTasks[delId] = { label: "删除向量数据", step: "done", pct: 0, state: "FAILURE" };
    renderTaskPanel();
    setStatus("删除失败", e.message, 0, "FAILURE");
    toast("删除失败: "+e.message, "error");
  }
  setTimeout(() => { delete state.runningTasks[delId]; renderTaskPanel(); setStatus(null); }, 3000);
}

// Re-render the Milvus table from the current `milvusDocs` array
// without calling the server — pure local update.
function _renderMilvusTable() {
  milvusDocs = milvusDocs.map(d => ({ ...d, pk: String(d.pk != null ? d.pk : d.id) }));
  const el = document.getElementById("milvusDocList");
  const tb = document.getElementById("milvusToolbar");
  if (!el) return;
  if (!milvusDocs.length) {
    if (tb) tb.style.display = "none";
    el.innerHTML = "<div class=\"card\"><div class=\"empty-state\"><div class=\"icon\">"+icon("search",48)+"</div><p>无结果 (共 0 条)</p></div></div>";
    return;
  }
  if (tb) tb.style.display = "";
  el.innerHTML = `<div class="card">
    <div style="font-size:12px;color:var(--ink-faint);margin-bottom:8px;">共 ${milvusDocs.length} 条</div>
    <table><thead><tr><th style="width:32px;"><input type="checkbox" id="milvusCheckAll" onchange="toggleCheckAllMilvus()" title="全选"></th><th>ID</th><th>内容（完整）</th><th>源文件</th><th style="width:50px;">操作</th></tr></thead><tbody>${milvusTableBodyHtml()}</tbody></table>${milvusPaginationHtml(milvusDocs.length)}
  </div>`;
  // and new checkbox elements exist.
  var cbAll = document.getElementById("milvusCheckAll");
  if (cbAll) cbAll.checked = false;
  updateMilvusToolbar();
  setTimeout(refreshIcons, 50);
}

// Lightweight: decrement both stat panels in-place (no server round-trip).
function refreshGlobalMilvusStatsAfterDelete(coll, count) {
  _optimisticDecrementStats(coll, count);
}

async function batchDeleteMilvus() {
  const checked = getCheckedMilvus();
  if (!checked.length) { toast("请先勾选要删除的数据", "error"); return; }
  if (!confirm("确定要删除选中的 "+checked.length+" 条向量数据吗？此操作不可撤销。")) return;
  const ids = checked.map(d => d.pk != null ? d.pk : d.id);
  // Optimistically remove rows and re-render the table immediately
  const checkSet = new Set(ids.map(String));
  milvusDocs = milvusDocs.filter(d => !checkSet.has(String(d.pk)));
  _renderMilvusTable();
  // Also decrement the global stat counters optimistically
  refreshGlobalMilvusStatsAfterDelete(milvusColl, ids.length);
  const delId = "batch_del_"+Date.now();
  state.runningTasks[delId] = { label: "批量删除向量数据", step: "deleting", pct: 0 };
  renderTaskPanel();
  setStatus("批量删除向量数据", "正在删除 "+ids.length+" 条数据...", 0);
  try {
    const r = await API.post("/api/milvus/batch-delete?collection="+encodeURIComponent(milvusColl)+"&"+tenantScopeQuery(), ids);
    state.runningTasks[delId] = { label: "批量删除向量数据", step: "done", pct: 100, state: "SUCCESS" };
    renderTaskPanel();
    setStatus("批量删除完毕", "成功删除 "+r.count+" 条数据", 100, "SUCCESS");
    toast("删除完成: "+r.count+" 条成功");
    // Wait for Milvus flush+load to settle before reconciling from server
    setTimeout(() => loadMilvusDocs(), 600);
  } catch(e) {
    // Restore from server if the batch delete actually failed
    loadMilvusDocs();
    state.runningTasks[delId] = { label: "批量删除向量数据", step: "done", pct: 0, state: "FAILURE" };
    renderTaskPanel();
    setStatus("批量删除失败", e.message, 0, "FAILURE");
    toast("批量删除失败: "+e.message, "error");
  }
  setTimeout(() => { delete state.runningTasks[delId]; renderTaskPanel(); setStatus(null); }, 3000);
}

async function deleteAllMilvus() {
  if (!milvusDocs.length) { toast("没有可删除的数据", "error"); return; }
  if (!confirm("确定要删除当前列表中的全部 "+milvusDocs.length+" 条向量数据吗？此操作不可撤销。")) return;
  if (!confirm("再次确认: 这将会清空所有筛选结果，确定继续？")) return;
  const ids = milvusDocs.map(d => d.pk != null ? d.pk : d.id);
  // Optimistically clear the list and stats immediately
  const oldCount = milvusDocs.length;
  milvusDocs = [];
  _renderMilvusTable();
  refreshGlobalMilvusStatsAfterDelete(milvusColl, oldCount);
  const delId = "all_del_"+Date.now();
  state.runningTasks[delId] = { label: "全部删除向量数据", step: "deleting", pct: 0 };
  renderTaskPanel();
  setStatus("全部删除向量数据", "正在删除 "+ids.length+" 条数据...", 0);
  try {
    const r = await API.post("/api/milvus/batch-delete?collection="+encodeURIComponent(milvusColl)+"&"+tenantScopeQuery(), ids);
    state.runningTasks[delId] = { label: "全部删除向量数据", step: "done", pct: 100, state: "SUCCESS" };
    renderTaskPanel();
    setStatus("全部删除完毕", "成功删除 "+r.count+" 条数据", 100, "SUCCESS");
    toast("删除完成: "+r.count+" 条成功");
    // Wait for Milvus flush+load to settle before reconciling from server
    setTimeout(() => loadMilvusDocs(), 600);
  } catch(e) {
    // Restore from server if the batch delete actually failed
    loadMilvusDocs();
    state.runningTasks[delId] = { label: "全部删除向量数据", step: "done", pct: 0, state: "FAILURE" };
    renderTaskPanel();
    setStatus("全部删除失败", e.message, 0, "FAILURE");
    toast("全部删除失败: "+e.message, "error");
  }
  setTimeout(() => { delete state.runningTasks[delId]; renderTaskPanel(); setStatus(null); }, 3000);
}

// ── 初始化 ───────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", async () => {
  // Restore the saved API key (if any) into the sidebar field.
  const keyInput = document.getElementById("apiKeyInput");
  const keyStatus = document.getElementById("apiKeyStatus");
  if (keyInput) {
    keyInput.value = localStorage.getItem("pipeline_api_key") || "";
    keyInput.addEventListener("change", () => {
      const k = keyInput.value.trim();
      if (k) localStorage.setItem("pipeline_api_key", k);
      else localStorage.removeItem("pipeline_api_key");
      if (keyStatus) keyStatus.textContent = k ? "已保存" : "已清除";
      setTimeout(() => { if (keyStatus) keyStatus.textContent = ""; }, 2000);
    });
  }

  await loadFiles();
  render();

  // Refresh upload size caps + auth requirement from the backend.
  try {
    const c = await API.get("/api/config");
    uploadCaps = { max_file_size_mb: c.max_file_size_mb, max_image_size_mb: c.max_image_size_mb };
    // If the backend requires an API key but none is saved, tell the user
    // up-front — otherwise every mutating action silently 401s.
    if (c.api_key_required && !localStorage.getItem("pipeline_api_key")) {
      const statusEl = document.getElementById("apiKeyStatus");
      if (statusEl) {
        statusEl.textContent = "⚠ 后端已启用 API Key，请在此填写";
        statusEl.style.color = "var(--warn)";
      }
      toast("后端需要 API Key：请在左侧边栏填写（与 .env 的 API_KEY 一致），否则删除/上传/入库会失败", "error");
    }
  } catch(e) {}

  // Sidebar page switching
  document.querySelectorAll(".sidebar__nav-item[data-page]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      state.activePage = el.dataset.page;
      // Render immediately with cached data; then refresh from server.
      render();
      loadFiles().then(() => render());
    });
  });

  // 初始化全局 Milvus 统计
  _fetchAndRefreshStats();

  // 每 8 秒后台静默刷新 Milvus 统计（二次确认，校正任何遗漏）
  setInterval(function() {
    _fetchAndRefreshStats();
  }, 8000);
});

<script>
function openMetaEdit(fileId) {
  const f = state.files.find(x => x.id === fileId);
  if (!f) return;
  const fields = [
    { key: "tenant_id",   label: "租户编号",   value: f.tenant_id || "default" },
    { key: "kb_id",       label: "知识库编号", value: f.kb_id || "default" },
    { key: "product_id",  label: "产品编号",   value: f.product_id || "" },
    { key: "mushroom_type", label: "业务分类",     value: f.mushroom_type || "" },
  ];
  document.getElementById("metaEditFields").innerHTML = fields.map(fd =>
    '<label style="font-size:13px;">'+fd.label+
    '<input id="meta_'+fd.key+'" value="'+esc(fd.value)+'" style="width:100%;margin-top:4px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;">'+
    '</label>'
  ).join("");
  document.getElementById("metaEditOverlay").dataset.fileId = fileId;
  document.getElementById("metaEditOverlay").style.display = "flex";
}

async function saveMetaEdit() {
  const overlay = document.getElementById("metaEditOverlay");
  const fileId = overlay.dataset.fileId;
  if (!fileId) return;
  const body = {};
  ["tenant_id","kb_id","product_id","mushroom_type"].forEach(k => {
    const el = document.getElementById("meta_"+k);
    if (el) body[k] = el.value;
  });
  try {
    await API.put("/api/files/"+fileId+"/meta", body);
    toast("已保存" + (body.tenant_id !== undefined || body.kb_id !== undefined ? "，如已入库请重新入库以更新向量" : ""));
    closeMetaEdit();
    await loadFiles();
    refreshFileList();
    renderWorkflow();
  } catch(e) {
    toast("保存失败: "+e.message, "error");
  }
}

function closeMetaEdit() {
  document.getElementById("metaEditOverlay").style.display = "none";
}
</script>
