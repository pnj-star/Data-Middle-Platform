[project]
name = "data-middle-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "pymilvus>=2.5",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "cn-clip>=1.1",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "prometheus-client>=0.20",
    "boto3>=1.34",
    "tiktoken>=0.7",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
